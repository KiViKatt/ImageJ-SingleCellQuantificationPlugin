#Cell Quant Studio Universal profile
# Example four-channel profile: C1 SOX2 (objects), C2 Caspase-3 (intensity),
# C3 MAP2 (positive area), C4 DAPI (objects + area, local threshold with CLAHE).
# A starting point only: check every threshold and size filter on your own images.
